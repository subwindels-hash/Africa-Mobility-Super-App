name: amsa_app
description: AMSA — Africa Mobility Super App (customer / driver / rider flavors)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # state management + DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # navigation
  go_router: ^14.2.7
  # network
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1
  # storage
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  # maps & location
  google_maps_flutter: ^2.9.0
  flutter_map: ^7.0.2          # OSM fallback provider
  geolocator: ^13.0.1
  # ui
  lucide_icons: ^0.456.0
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  lottie: ^3.1.2
  # safety / biometrics
  local_auth: ^2.3.0
  shake_gesture: ^1.0.3
  # audio (voice notes)
  record: ^5.1.2
  just_audio: ^0.9.40
  # push
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  # crash/perf
  sentry_flutter: ^8.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  drift_dev: ^2.20.3
  patrol: ^3.11.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
