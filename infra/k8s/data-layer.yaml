###############################################################################
# AMSA — data layer (docs/16 §38/39): PostgreSQL (RDS in prod; this manifest
# is the in-cluster pattern for staging/dev), Redis, migration Job, backups.
###############################################################################
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: core
spec:
  serviceName: postgres
  replicas: 1                     # staging pattern; prod = AWS RDS Multi-AZ
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: amsa }
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: postgres-creds, key: user } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: postgres-creds, key: password } } }
          resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { cpu: "2", memory: 4Gi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe: { exec: { command: [pg_isready, -U, postgres] }, initialDelaySeconds: 5 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 50Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: core }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: core
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: [--appendonly, "yes", --maxmemory, 1gb, --maxmemory-policy, allkeys-lru]
          ports: [{ containerPort: 6379 }]
          resources: { requests: { cpu: 200m, memory: 512Mi } }
          readinessProbe: { tcpSocket: { port: 6379 } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: core }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }
---
# Schema migrations run as a Job per release (database/migrations/*.sql)
apiVersion: batch/v1
kind: Job
metadata:
  name: amsa-migrations
  namespace: core
  annotations: { "helm.sh/hook": pre-install,pre-upgrade }
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/amsa/api:latest
          command: [sh, -c, "for f in /migrations/*.sql; do psql \"$DATABASE_URL\" -f \"$f\"; done"]
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: postgres-creds, key: url } } }
