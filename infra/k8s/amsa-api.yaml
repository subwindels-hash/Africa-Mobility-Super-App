# AMSA — core deployment pattern (EKS). Full chart: infra/k8s/
# Standards from docs/16 §39: 2+ replicas, topology spread, PDB, HPA, probes.
apiVersion: v1
kind: Namespace
metadata:
  name: core
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amsa-api
  namespace: core
  labels: { app: amsa-api, domain: core }
spec:
  replicas: 3
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: amsa-api }
  template:
    metadata:
      labels: { app: amsa-api, domain: core }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: amsa-api
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: amsa-api } }
      containers:
        - name: api
          image: ghcr.io/amsa/amsa-api:latest   # set by Argo CD / Kustomize
          ports: [{ containerPort: 4000, name: http }]
          envFrom:
            - secretRef: { name: amsa-api-secrets }   # synced from AWS Secrets Manager CSI
            - configMapRef: { name: amsa-api-config }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            httpGet: { path: /v1/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v1/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: amsa-api
  namespace: core
spec:
  selector: { app: amsa-api }
  ports: [{ port: 80, targetPort: 4000, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: amsa-api
  namespace: core
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: amsa-api }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
    - type: Pods
      pods:
        metric: { name: http_requests_per_second }
        target: { type: AverageValue, averageValue: "150" }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: amsa-api
  namespace: core
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: amsa-api }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: amsa-api-egress
  namespace: core
spec:
  podSelector:
    matchLabels: { app: amsa-api }
  policyTypes: [Egress]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { name: data } } }]   # DB/cache within cluster edge
    - to: [{ namespaceSelector: { matchLabels: { name: ingress } } }]
    # money namespace additionally denies public egress (see money-policy.yaml)
