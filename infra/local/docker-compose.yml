# AMSA local development stack — `docker compose up -d`
# Mirrors the AWS topology (docs/16) at laptop scale.
version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: amsa
      POSTGRES_PASSWORD: amsa_dev
      POSTGRES_DB: amsa
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amsa"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]

  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]

  osrm:  # free OSM routing fallback (docs FR-MAP-003)
    image: osrm/osrm-backend
    ports: ["5000:5000"]
    command: osrm-routed --algorithm mld /data/nigeria-latest.osrm
    volumes:
      - osrm-data:/data

  api:
    build:
      context: ../../backend
      dockerfile: ../infra/local/Dockerfile.api
    environment:
      PORT: "4000"
      DATABASE_URL: postgres://amsa:amsa_dev@postgres:5432/amsa
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      RUN_SERVER: "1"
    ports: ["4000:4000"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  osrm-data:
